<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Priya ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
background:linear-gradient(to right,#ff758c,#ff7eb3);
color:white;
overflow:hidden;
}

/* Intro */
#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
animation:fadeOut 4s forwards 3s;
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

.container{margin-top:15%;}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:25px;
background:white;
color:#ff4b7d;
cursor:pointer;
margin:10px;
}

.hidden{display:none;}

img{
width:280px;
height:350px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

/* Hearts */
.heart{
position:fixed;
font-size:20px;
animation:float 5s linear infinite;
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-100vh);}
}

/* Fireworks */
.firework{
position:fixed;
font-size:25px;
animation:boom 1s ease-out forwards;
}

@keyframes boom{
0%{opacity:1; transform:scale(0);}
100%{opacity:0; transform:scale(3);}
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
Siddu ❤️ Priya
</div>

<!-- PASSWORD -->
<div id="passwordPage" class="container">
<h2>Enter Secret Code ❤️</h2>
<input type="password" id="pass">
<br><br>
<button onclick="checkPass()">Enter</button>
</div>

<!-- MAIN PAGE -->
<div id="mainPage" class="hidden">

<h1>Hey Priya ❤️</h1>

<p id="story"></p>

<img id="slide" src="p1.jpg">

<br><br>

<h2>Will You Be Mine Forever? 💖</h2>

<button onclick="yesLove()">YES ❤️</button>
<button onclick="noLove()">NO 😜</button>

</div>

<audio id="bgmusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

/* Start music when screen clicked */
document.body.addEventListener("click", function(){
document.getElementById("bgmusic").play();
});

/* PASSWORD */
function checkPass(){
let p=document.getElementById("pass").value;

if(p=="143"){
document.getElementById("passwordPage").classList.add("hidden");
document.getElementById("mainPage").classList.remove("hidden");
typeStory();
}
else{
alert("Wrong Code 😜");
}
}

/* LOVE MESSAGE TYPING */
let msg="ಅಮ್ಮು… ನನ್ನ ಜೀವನದಲ್ಲಿ ಪ್ರೀತಿ ಅಂದರೆ ಏನು ಅನ್ನೋದನ್ನ ನನಗೆ ಕಲಿಸಿದ ವ್ಯಕ್ತಿ ನೀನು… ಮೊದಲು ಜೀವನ ಕೇವಲ ದಿನಗಳು ಸಾಗುತ್ತಿದ್ದಂತೆ ಅನ್ನಿಸುತ್ತಿತ್ತು… ಆದರೆ ನೀನು ಬಂದ ಮೇಲೆ ಪ್ರತಿದಿನವೂ ನಿನ್ನ ನೆನಪಿನಿಂದ ಆರಂಭವಾಗುತ್ತಿದೆ.\n\nನಿನ್ನ ಒಂದು ಸಂದೇಶ ಬರೋದಕ್ಕೆ ನಾನು ಕಾಯುತ್ತೇನೆ… ನಿನ್ನ ಒಂದು ನಗು ನೋಡೋದಕ್ಕೆ ನನ್ನ ಮನಸ್ಸು ಸಾವಿರ ಕನಸು ಕಾಣುತ್ತದೆ. ಕೆಲವೊಮ್ಮೆ ನಾನು ಯೋಚಿಸುತ್ತೇನೆ… ನೀನು ನನ್ನ ಜೀವನದಲ್ಲಿ ಇರದಿದ್ದರೆ ನಾನು ಹೇಗಿರುತ್ತಿದ್ದೆ ಅಂತ.\n\nಪ್ರಿಯಾ… ನೀನು ನನ್ನ ಜೀವನದ ಒಂದು ಸುಂದರ ಕನಸು… ಆದರೆ ಕಣ್ಣು ತೆರೆದಾಗಲೂ ಉಳಿಯುವ ಕನಸು. ನಿನ್ನ ನಗು ನನ್ನ ದಿನದ ಬೆಳಕು… ನಿನ್ನ ನೆನಪು ನನ್ನ ರಾತ್ರಿ ನಕ್ಷತ್ರ.\n\nನಿನ್ನ ಜೊತೆ ಮಾತನಾಡುವ ಪ್ರತೀ ಕ್ಷಣ ನನ್ನ ಹೃದಯಕ್ಕೆ ಒಂದು ಸಂಗೀತದಂತೆ ಅನುಭವವಾಗುತ್ತದೆ… ನಿನ್ನ ಹೆಸರು ನನ್ನ ಮನಸ್ಸಿನಲ್ಲಿ ಒಂದು ಮಧುರ ಕವನವಾಗಿ ಉಳಿದಿದೆ. ನೀನು ದೂರ ಇದ್ದರೂ ನನ್ನ ಚಿಂತನೆಗಳಲ್ಲಿ ಸದಾ ಹತ್ತಿರವಾಗಿಯೇ ಇರುತ್ತೀಯ.\n\nನಿನ್ನ ಸಂತೋಷ ನನ್ನ ಸಂತೋಷವಾಗಿದೆ… ನಿನ್ನ ನೋವು ನನ್ನ ಹೃದಯಕ್ಕೆ ನೋವಾಗುತ್ತದೆ. ನಿನ್ನ ಜೊತೆ ಮಾತನಾಡದ ದಿನ ನನಗೆ ಅಪೂರ್ಣ ಅನ್ನಿಸುತ್ತದೆ.\n\nಅಮ್ಮು… ನಾನು ಪರಿಪೂರ್ಣ ವ್ಯಕ್ತಿ ಅಲ್ಲ… ಆದರೆ ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುವಲ್ಲಿ ನಾನು ನಿಜವಾದವನು. ನಿನ್ನ ನಗು ಸದಾ ಹಾಗೆ ಇರಬೇಕು ಅನ್ನೋದೇ ನನ್ನ ದೊಡ್ಡ ಆಸೆ.\n\nಪ್ರೀತಿ ಅಂದರೆ ಯಾರಾದರೂ ಜೊತೆ ಇರಬೇಕು ಅನ್ನಿಸುವ ಭಾವನೆ ಅಲ್ಲ… ಅವರಿಲ್ಲದೆ ಜೀವನ ಅಪೂರ್ಣ ಅನ್ನಿಸುವ ಭಾವನೆ… ಮತ್ತು ಇಂದು ಆ ಭಾವನೆ ನನ್ನ ಮನಸ್ಸಿನಲ್ಲಿ ನೀನೆ ಆಗಿದ್ದೀಯ.\n\nನನ್ನ ಹೃದಯದ ಪ್ರತೀ ತಾಳವೂ ನಿನ್ನ ಹೆಸರನ್ನೇ ಹೇಳುತ್ತಿದೆ… ನನ್ನ ಕನಸಿನ ಪ್ರತೀ ಬಣ್ಣದಲ್ಲೂ ನಿನ್ನ ಚಿತ್ರವೇ ಮೂಡುತ್ತಿದೆ.\n\nನನಗೆ ನೀನು ತುಂಬಾ ಇಷ್ಟ ಪ್ರಿಯಾ… ನಿಜವಾಗಿಯೂ ಹೃದಯದಿಂದ ಇಷ್ಟ… ಮತ್ತು ಜೀವನದ ಪ್ರತೀ ಕ್ಷಣ ನಿನ್ನ ಜೊತೆ ಹಂಚಿಕೊಳ್ಳಬೇಕು ಅನ್ನೋದು ನನ್ನ ಹೃದಯದ ಸತ್ಯ ❤️";
let i=0;

function typeStory(){
let story=document.getElementById("story");

let typing=setInterval(()=>{
if(i<msg.length){
story.innerHTML+=msg.charAt(i);
i++;
}
else clearInterval(typing);
},70);
}

/* PHOTO SLIDESHOW */
let photos=["p1.jpg","p2.jpg","p3.jpg","p4.jpg","p5.jpg"];

let index=0;

setInterval(()=>{
document.getElementById("slide").src=photos[index];
index=(index+1)%photos.length;
},3000);

/* HEARTS */
setInterval(()=>{
let heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),5000);
},500);

/* YES BUTTON */
function yesLove(){
alert("You Made Me Happiest Person ❤️");
fireworks();
}

/* NO BUTTON */
function noLove(){
alert("Think Again 😜");
}

/* FIREWORKS */
function fireworks(){
for(let i=0;i<30;i++){
let fw=document.createElement("div");
fw.classList.add("firework");
fw.innerHTML="💖";
fw.style.left=Math.random()*100+"vw";
fw.style.top=Math.random()*100+"vh";
document.body.appendChild(fw);
setTimeout(()=>fw.remove(),1000);
}
}

</script>

</body>
</html>
