<!DOCTYPE html>
<html>
<head>
<title>For My Ammu ❤️</title>

<style>

body{
margin:0;
font-family: Arial;
color:white;
text-align:center;
background-size:cover;
background-position:center;
transition: background 2s;
}

/* PASSWORD BOX */
#lock{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

input{
padding:10px;
font-size:18px;
}

button{
padding:10px 20px;
font-size:18px;
margin:10px;
cursor:pointer;
}

/* HEART FLOAT */
.heart{
position:fixed;
bottom:-10px;
font-size:20px;
animation: float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-100vh);opacity:0;}
}

/* ROSE FALL */
.petal{
position:fixed;
top:-10px;
font-size:25px;
animation: fall 8s linear infinite;
}

@keyframes fall{
100%{transform:translateY(100vh);}
}

/* END SCREEN */
.ending{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.neonText{
font-size:40px;
text-shadow:0 0 10px pink,0 0 20px pink;
}

</style>
</head>

<body>

<!-- PASSWORD SCREEN -->
<div id="lock">
<h2>Enter Secret Password ❤️</h2>
<input type="password" id="pass">
<button onclick="checkPass()">Enter</button>
</div>

<h1 id="typeText"></h1>

<h2>Will You Be Mine Forever? 💖</h2>

<button onclick="yesLove()">YES ❤️</button>
<button id="noBtn" onmouseover="moveNo()">NO 😜</button>

<div id="timer"></div>

<!-- MUSIC -->
<audio id="bgmusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<audio id="heartbeat">
<source src="heartbeat.mp3" type="audio/mpeg">
</audio>

<script>

/* PASSWORD */
function checkPass(){
let p=document.getElementById("pass").value;

if(p==="ammu123"){
document.getElementById("lock").style.display="none";
startLove();
}else{
alert("Wrong Password 😜");
}
}

/* START LOVE */
function startLove(){

document.getElementById("bgmusic").play();

/* LOVE MESSAGE */
let msg="ಅಮ್ಮು… ನನ್ನ ಜೀವನದಲ್ಲಿ ಪ್ರೀತಿ ಅಂದರೆ ಏನು ಅನ್ನೋದನ್ನ ನನಗೆ ಕಲಿಸಿದ ವ್ಯಕ್ತಿ ನೀನು… ನೀನು ಬಂದ ಮೇಲೆ ಪ್ರತಿದಿನವೂ ನಿನ್ನ ನೆನಪಿನಿಂದ ಆರಂಭವಾಗುತ್ತಿದೆ. ನಿನ್ನ ನಗು ನನ್ನ ದಿನದ ಬೆಳಕು… ನಿನ್ನ ನೆನಪು ನನ್ನ ರಾತ್ರಿ ನಕ್ಷತ್ರ. ನನಗೆ ನೀನು ತುಂಬಾ ಇಷ್ಟ ಪ್ರಿಯಾ ❤️";

let i=0;

function typing(){
if(i<msg.length){
document.getElementById("typeText").innerHTML+=msg.charAt(i);
i++;
setTimeout(typing,50);
}
}
typing();

/* HEART FLOAT */
setInterval(()=>{
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"%";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),6000);
},500);

/* ROSE FALL */
setInterval(()=>{
let p=document.createElement("div");
p.className="petal";
p.innerHTML="🌹";
p.style.left=Math.random()*100+"%";
document.body.appendChild(p);
setTimeout(()=>p.remove(),8000);
},1200);

/* BACKGROUND SLIDESHOW */
let photos=["photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg"];
let x=0;

setInterval(()=>{
document.body.style.backgroundImage=`url(${photos[x]})`;
x=(x+1)%photos.length;
},4000);

/* LOVE TIMER */
let loveDate=new Date("2024-01-01");

setInterval(()=>{
let now=new Date();
let diff=now-loveDate;
let days=Math.floor(diff/(1000*60*60*24));
document.getElementById("timer").innerHTML="❤️ Loving You Since "+days+" Days ❤️";
},1000);

}

/* NO BUTTON ESCAPE */
function moveNo(){
let btn=document.getElementById("noBtn");
btn.style.position="absolute";
btn.style.left=Math.random()*80+"%";
btn.style.top=Math.random()*80+"%";
}

/* FIREWORK */
function fireworkEffect(){
for(let i=0;i<20;i++){
let f=document.createElement("div");
f.innerHTML="✨";
f.style.position="fixed";
f.style.left=Math.random()*100+"%";
f.style.top=Math.random()*100+"%";
f.style.fontSize="30px";
document.body.appendChild(f);
setTimeout(()=>f.remove(),1000);
}
}

/* ROMANTIC END */
function romanticEnding(){
let music=document.getElementById("bgmusic");
let beat=document.getElementById("heartbeat");

let fade=setInterval(()=>{
if(music.volume>0.1){
music.volume-=0.1;
}else{
clearInterval(fade);
music.pause();
beat.play();
}
},300);
}

/* ENDING SCREEN */
function endingScene(){
document.body.innerHTML=`
<div class="ending">
<h1 class="neonText">Siddu ❤️ Priya</h1>
<h2>Our Love Story Begins Forever 💖</h2>
</div>`;
}

/* RING PROPOSAL */
function ringProposal(){
document.body.innerHTML=`
<div class="ending">
<h1>💍</h1>
<h2>Will You Marry Me Someday? ❤️</h2>
</div>`;
}

/* LOVE CERTIFICATE */
function loveCertificate(){
document.body.innerHTML=`
<div class="ending">
<h1>❤️ LOVE CERTIFICATE ❤️</h1>
<h2>Siddu 💖 Priya</h2>
<p>Officially Bound By Love</p>
<p>${new Date().toDateString()}</p>
</div>`;
}

/* YES BUTTON */
function yesLove(){

fireworkEffect();
romanticEnding();

setTimeout(()=>{
endingScene();

setTimeout(()=>{
ringProposal();

setTimeout(()=>{
loveCertificate();
},6000);

},4000);

},1000);

}

</script>

</body>
</html>
